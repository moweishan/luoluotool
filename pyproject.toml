[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luoluotool"
version = "0.1.0"
description = "面向 Windows 的《桃源深处有人家》桌面自动化挂机工具（个人自用）"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
